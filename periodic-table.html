E.forEach(e=>{const[r,c]=pos(e.z),k=cat(e.z);const b=document.createElement("button");b.className="t";b.style.cssText=`grid-row:${r};grid-column:${c};--c:${CATS[k][1]}`;
b.innerHTML=`<i class="n">${e.z}</i><i class="p"></i><b>${e.s}</b><span>${e.n}</span><span>${e.m}</span>`;b.onclick=()=>open(e);e.el=b;grid.append(b)});
[[6,"57–71","#f783ac"],[7,"89–103","#c0a062"]].forEach(([r,t])=>{const d=document.createElement("div");d.className="ph";d.style.cssText=`grid-row:${r};grid-column:3`;d.textContent=t;grid.append(d)});
CATS.forEach((c,i)=>{const b=document.createElement("button");b.className="chip";b.style.setProperty("--c",c[1]);b.innerHTML=`<i></i>${c[0]}`;b.onclick=()=>{st.cat=st.cat===i?null:i;b.parentNode.querySelectorAll(".chip").forEach((x,j)=>x.classList.toggle("on",st.cat===j));apply()};$("cats").append(b)});
PN.forEach((n,i)=>{const b=document.createElement("button");b.className="chip";b.textContent=n;b.onclick=()=>{st.st=st.st===i?null:i;[...$("sts").querySelectorAll(".chip")].forEach((x,j)=>x.classList.toggle("on",st.st===j));apply()};$("sts").append(b)});
$("sts").prepend(Object.assign(document.createElement("b"),{textContent:"State @ temperature:",style:"font-size:.75rem;margin-right:4px"}));
function apply(){const q=st.q.trim().toLowerCase();E.forEach(e=>{const p=ph(e,st.T);e.el.querySelector(".p").className="p s"+p;
const m=(!q||e.n.toLowerCase().includes(q)||e.s.toLowerCase()==q||e.s.toLowerCase().startsWith(q)||String(e.z)==q)&&(st.cat===null||cat(e.z)===st.cat)&&(st.st===null||p===st.st);e.el.classList.toggle("dim",!m)});
const T=st.T;$("tv").textContent=st.K?T+" K":Math.round(T-273.15)+" °C"}
$("q").oninput=e=>{st.q=e.target.value;apply()};$("tr").oninput=e=>{st.T=+e.target.value;apply()};$("tu").onclick=()=>{st.K=!st.K;apply()};
$("th").onclick=()=>{const r=document.documentElement,d=(r.dataset.theme||"dark")==="dark";r.dataset.theme=d?"light":"dark";try{localStorage.setItem("th",r.dataset.theme)}catch(_){}};
try{document.documentElement.dataset.theme=localStorage.getItem("th")||"dark"}catch(_){document.documentElement.dataset.theme="dark"}
let ac;$("snd").onclick=()=>{st.snd=!st.snd;$("snd").textContent=st.snd?"🔊":"🔇";beep(660)};
function beep(f){if(!st.snd)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type="sine";g.gain.setValueAtTime(.08,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.18);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.2)}catch(_){}}
document.addEventListener("mouseover",e=>{if(e.target.closest&&e.target.closest(".t"))beep(880)});
// ---------- Drawer ----------
const kv=(a,b)=>`<div class="kv"><span>${a}</span><span>${b}</span></div>`,u=(v,s)=>v===""||v==null?"—":v+" "+s;
function open(e){beep(520);const k=cat(e.z),c=CATS[k][1],K=x=>x==null?"—":x+" K ("+Math.round(x-273.15)+" °C)";
const F=" 1 3 11 12 15 16 19 20 37 55 56 87 ",X=" 4 33 34 35 48 80 81 82 84 86 88 92 ",R=" 1 3 4 9 11 12 15 17 19 20 35 37 38 55 56 87 88 ";
const h=(t,on)=>`<div class="${on?"a":""}">${t}</div>`;
$("info").innerHTML=`<div class="hd" style="--c:${c}"><div class="big">${e.s}</div><div><h2>${e.n}</h2><p>#${e.z} · ${CATS[k][0]} · ${e.m} u</p></div></div>
<div class="sec g"><h3>Basic info</h3>${kv("Category",CATS[k][0])}${kv("Group",grp(e.z))}${kv("Period",per(e.z))}${kv("Block",blk(e.z)+"-block")}${kv("Phase at STP",PN[ph(e,293)])}${kv("Shells (K, L, M…)",shells(e.z).join(", "))}</div>
<div class="sec g"><h3>Atomic properties</h3>${kv("Electron configuration",cfgStr(e.z))}${kv("Electronegativity",e.en||"—")}${kv("Atomic radius",u(e.rad,"pm"))}${kv("Ionization energy",u(e.ie,"eV"))}</div>
<div class="sec g"><h3>Thermodynamics</h3>${kv("Melting point",K(e.mp))}${kv("Boiling point",K(e.bp))}${kv("Density",u(e.rho,"g/cm³"))}</div>
<div class="sec g"><h3>History</h3>${kv("Discovered by",e.by||"Known since antiquity")}${kv("Year",e.yr?e.yr:"Ancient")}</div>
<div class="sec g"><h3>Hazards</h3><div class="hz">${h("🔥 Flammable",F.includes(" "+e.z+" "))}${h("☠️ Toxic",X.includes(" "+e.z+" ")||rad(e.z))}${h("⚠️ Reactive",R.includes(" "+e.z+" "))}${h("☢️ Radioactive",rad(e.z))}</div></div>`;
document.body.classList.add("open");setTimeout(()=>show3d(shells(e.z),c),60)}
function close(){document.body.classList.remove("open");cancelAnimationFrame(raf);beep(400)}
$("x").onclick=close;$("ov").onclick=close;addEventListener("keydown",e=>e.key==="Escape"&&close());
// ---------- 3D ----------
let R,S,C,G,els=[],raf,last=0;
function glow(col){const c=document.createElement("canvas");c.width=c.height=128;const x=c.getContext("2d"),g=x.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,col);g.addColorStop(.3,col+"88");g.addColorStop(1,"#0000");x.fillStyle=g;x.fillRect(0,0,128,128);return new THREE.CanvasTexture(c)}
function show3d(sh,col){const cv=$("cv"),w=cv.clientWidth,h=cv.clientHeight;R=R||new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(w,h,false);
S=new THREE.Scene();C=new THREE.PerspectiveCamera(50,w/h,.1,100);C.position.z=Math.max(6,sh.length*1.1+4);G=new THREE.Group();S.add(G);els=[];
G.add(new THREE.Mesh(new THREE.SphereGeometry(.55,32,32),new THREE.MeshBasicMaterial({color:col})));
const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:glow(col),blending:THREE.AdditiveBlending,transparent:true,depthWrite:false}));sp.scale.set(3.6,3.6,1);G.add(sp);
sh.forEach((n,i)=>{const r=1.2+i*.7,p=new THREE.Group();p.rotation.set(i*.55+.3,i*.8,i*.3);G.add(p);
p.add(new THREE.Mesh(new THREE.TorusGeometry(r,.012,8,128),new THREE.MeshBasicMaterial({color:0x8fa0ff,transparent:true,opacity:.45})));
for(let k=0;k<n;k++){const m=new THREE.Mesh(new THREE.SphereGeometry(.075,12,12),new THREE.MeshBasicMaterial({color:0xffffff}));p.add(m);els.push({m,r,a:k/n*6.283,v:1.1/(1+i*.6)})}});
cancelAnimationFrame(raf);last=performance.now();loop()}
function loop(t){raf=requestAnimationFrame(loop);const d=((t||last)-last)/1000;last=t||last;els.forEach(o=>{o.a+=o.v*d;o.m.position.set(Math.cos(o.a)*o.r,Math.sin(o.a)*o.r,0)});if(!drag)G.rotation.y+=d*.25;R.render(S,C)}
let drag=false;const ptr=new Map();let pd=0;const cv=$("cv");
cv.oncontextmenu=e=>e.preventDefault();
cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,e);drag=true;pd=0};
cv.onpointerup=cv.onpointercancel=e=>{ptr.delete(e.pointerId);drag=ptr.size>0;pd=0};
cv.onpointermove=e=>{const p=ptr.get(e.pointerId);if(!p)return;const dx=e.clientX-p.clientX,dy=e.clientY-p.clientY;ptr.set(e.pointerId,e);
if(ptr.size==2){const[a,b]=[...ptr.values()],d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);if(pd)C.position.z=Math.min(30,Math.max(3,C.position.z-(d-pd)*.03));pd=d}
else if(e.shiftKey||e.buttons==2){const s=C.position.z*.0016;G.position.x+=dx*s;G.position.y-=dy*s}
else{G.rotation.y+=dx*.01;G.rotation.x+=dy*.01}};
cv.onwheel=e=>{e.preventDefault();C.position.z=Math.min(30,Math.max(3,C.position.z*(1+e.deltaY*.001)))};
addEventListener("resize",()=>{if(!R||!document.body.classList.contains("open"))return;const w=cv.clientWidth,h=cv.clientHeight;R.setSize(w,h,false);C.aspect=w/h;C.updateProjectionMatrix()});
apply();
</script></body></html>
